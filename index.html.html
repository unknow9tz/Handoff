<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05070b;
  --glass:rgba(255,255,255,.035);
  --glass-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.15);
  --text:#eef2f7;
  --muted:#8b95a7;
  --teal:#2dd4bf;
  --indigo:#818cf8;
  --amber:#fbbf24;
  --rose:#fb7185;
  --grad:linear-gradient(135deg,#2dd4bf 0%,#818cf8 100%);
  --r:20px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;padding-bottom:112px;
  font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;
  color:var(--text);
  background:
    radial-gradient(ellipse 120% 60% at 50% -18%,rgba(61,255,176,.22),transparent 70%),
    radial-gradient(ellipse 80% 40% at 50% 0%,rgba(16,94,80,.45),transparent 75%),
    linear-gradient(180deg,#03231d 0%,#021612 50%,#010a08 100%);
  background-attachment:fixed;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:-10% -20% 20% -20%;z-index:-2;pointer-events:none;
  background:
    repeating-linear-gradient(92deg,rgba(255,255,255,0) 0 18px,rgba(255,255,255,.12) 24px,rgba(255,255,255,0) 34px,rgba(255,255,255,0) 52px),
    linear-gradient(95deg,transparent 4%,rgba(90,255,190,.95) 18%,rgba(45,230,200,.55) 30%,transparent 38%,
      rgba(178,140,255,.95) 52%,rgba(60,220,255,.8) 66%,transparent 78%),
    linear-gradient(180deg,rgba(140,255,210,.45),transparent 75%);
  filter:blur(12px) saturate(160%) brightness(1.15);
  -webkit-filter:blur(12px) saturate(160%) brightness(1.15);
  mix-blend-mode:screen;
  opacity:1;
  mask-image:linear-gradient(180deg,#000 45%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 45%,transparent 100%);
  background-size:200% 100%,200% 100%,100% 100%;
  background-repeat:repeat-x,repeat-x,no-repeat;
  animation:flow 9s linear infinite,sway 7s ease-in-out infinite;
  will-change:transform;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%),
    radial-gradient(1px 1px at 12% 18%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 67% 9%,#d9fff1,transparent),
    radial-gradient(1px 1px at 84% 34%,#fff,transparent),
    radial-gradient(1px 1px at 33% 42%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 91% 62%,#c4fff0,transparent),
    radial-gradient(1px 1px at 5% 70%,#fff,transparent),
    radial-gradient(1px 1px at 52% 24%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 22% 88%,#d9fff1,transparent);
  opacity:.75;
  animation:twinkle 6s ease-in-out infinite alternate;
}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.03em;font-weight:700}
h2{font-size:1.5rem}
h3{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}

/* HEADER */
.top{
  position:sticky;top:0;z-index:50;
  background:rgba(1,14,12,.65);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.02em;font-size:1.05rem}
.mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--grad);color:#05070b;font-family:'JetBrains Mono',monospace;font-weight:600;
  box-shadow:0 0 24px rgba(45,212,191,.35);
}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--glass-2);border:1px solid var(--line)}
.seg button{
  border:0;background:none;cursor:pointer;padding:8px 16px;border-radius:10px;
  color:var(--muted);font-weight:500;font-size:.92rem;transition:background .25s var(--ease),color .25s var(--ease);
}
.seg button[aria-selected="true"]{background:#fff;color:#05070b;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}

/* MAIN / HERO */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hero{padding:64px 24px 28px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);
}
.eyebrow::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal);
  animation:pulse 2s infinite;
}
.hero h1{font-size:clamp(2.3rem,6vw,4.2rem);line-height:1.02;margin:16px 0 14px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--muted);max-width:56ch;font-size:1.05rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}
.stat{padding:18px 20px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
.stat b{display:block;font-size:1.8rem;letter-spacing:-.03em;line-height:1.2}
.stat span{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

.view{padding:12px 0 40px}
.sec-head{display:flex;align-items:center;gap:12px;margin:8px 0 18px}
.count{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line)}

/* GLASS + FORM */
.glass{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:24px;
  transition:border-color .3s;
}
.glass:hover{border-color:var(--line-2)}
.base-card{margin-bottom:16px}
.base{display:grid;grid-template-columns:1fr 1.4fr 1.4fr;gap:16px}
.field label{
  display:block;margin-bottom:8px;font-family:'JetBrains Mono',monospace;font-size:.7rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
}
input,textarea{
  width:100%;font:inherit;font-size:.95rem;color:var(--text);
  background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
input::placeholder,textarea::placeholder{color:#5b6475}
input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(45,212,191,.12)}
input.invalid,.chips.invalid .chip{border-color:rgba(251,113,133,.6)!important}
input[type="date"]{color-scheme:dark}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chip{
  cursor:pointer;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);color:var(--muted);font-size:.9rem;transition:all .2s var(--ease);
}
.chip:hover{color:var(--text);border-color:var(--line-2)}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--teal);background:rgba(45,212,191,.1);box-shadow:0 0 0 3px rgba(45,212,191,.08)}
.chip small{margin-left:6px;opacity:.6;font-family:'JetBrains Mono',monospace;font-size:.7rem}

/* PANELS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.panel.hot{grid-column:1/-1;border-color:rgba(251,191,36,.3);background:linear-gradient(180deg,rgba(251,191,36,.06),var(--glass))}
.panel.hot .ico{background:rgba(251,191,36,.15)}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ph h3{flex:1}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--glass-2);font-size:1rem;flex-shrink:0}
.add{display:flex;gap:8px;align-items:stretch}
.add textarea{height:46px;min-height:46px;resize:none;padding:11px 14px;line-height:1.3}
.plus{
  width:46px;flex-shrink:0;border:0;border-radius:12px;cursor:pointer;
  background:#fff;color:#05070b;font-size:1.4rem;font-weight:600;line-height:1;transition:transform .2s var(--ease),box-shadow .2s;
}
.plus:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,255,255,.15)}
.items{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.items:empty::after{content:"Rien pour le moment";font-size:.85rem;color:#5b6475;padding:4px 2px}
.items li{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;
  background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.14);font-size:.92rem;
  animation:in .35s var(--ease);
}
.items li span{flex:1;white-space:pre-wrap;word-break:break-word}
.icon-btn{
  border:0;background:none;cursor:pointer;color:var(--muted);font-size:.95rem;line-height:1;
  padding:4px 6px;border-radius:8px;transition:color .2s,background .2s;flex-shrink:0;
}
.icon-btn:hover{color:var(--rose);background:rgba(251,113,133,.1)}

/* SAVE BAR */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(1,12,10,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:14px 24px;
}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.muted{color:var(--muted);font-size:.9rem}
.cta{
  border:0;cursor:pointer;padding:14px 26px;border-radius:14px;background:var(--grad);color:#05070b;
  font-weight:700;box-shadow:0 10px 30px rgba(45,212,191,.22);transition:transform .25s var(--ease),box-shadow .25s;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(45,212,191,.32)}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:96px;z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:12px 18px;border-radius:14px;background:#eef2f7;color:#05070b;font-weight:600;font-size:.92rem;
  transition:opacity .35s var(--ease),transform .35s var(--ease);white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--rose)}

/* HISTORY */
.tools{margin-bottom:18px}
.search{padding:14px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{
  all:unset;box-sizing:border-box;position:relative;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--line);
  transition:transform .35s var(--ease),border-color .3s,background .3s;
}
.card::after{
  content:"";position:absolute;right:-60px;bottom:-60px;width:180px;height:180px;pointer-events:none;
  background:radial-gradient(circle,rgba(129,140,248,.28),transparent 70%);opacity:0;transition:opacity .4s;
}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:rgba(45,212,191,.35);background:var(--glass-2)}
.card:hover::after{opacity:1}
.badge{
  align-self:flex-start;font-size:.78rem;padding:5px 10px;border-radius:999px;
  background:rgba(45,212,191,.1);color:var(--teal);border:1px solid rgba(45,212,191,.25);
}
.card .meta{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);text-transform:capitalize}
.card .name{font-size:1.25rem;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.card .loc{color:var(--muted);font-size:.9rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:.78rem;padding:4px 9px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line)}
.empty{
  grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--muted);
  border:1px dashed var(--line-2);border-radius:var(--r);
}
.empty h3{color:var(--text);font-size:1.2rem;margin-bottom:6px}

/* DIALOG */
dialog{
  border:0;padding:0;background:transparent;color:var(--text);
  width:min(640px,calc(100vw - 32px));max-height:88vh;margin:auto;
}
dialog::backdrop{background:rgba(2,3,6,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
dialog[open] .sheet{animation:pop .35s var(--ease)}
.sheet{
  background:#0b0f16;border:1px solid var(--line-2);border-radius:24px;padding:28px;
  max-height:88vh;overflow:auto;box-shadow:0 40px 100px rgba(0,0,0,.6);
}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-title{font-size:1.9rem;margin:16px 0 6px}
.sh-meta{color:var(--muted);margin:0;font-size:.95rem}
.msec{margin-top:22px}
.msec h4{
  margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--teal);font-weight:600;
}
.msec ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.msec li{padding:10px 12px;background:var(--glass);border-radius:12px;border:1px solid var(--line);white-space:pre-wrap;font-size:.92rem;word-break:break-word}
.acts{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{
  flex:1;min-width:150px;padding:13px 16px;border-radius:12px;cursor:pointer;font-weight:600;
  border:1px solid var(--line-2);background:var(--glass-2);transition:all .25s var(--ease);
}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--grad);color:#05070b;border-color:transparent}
.btn.danger{color:var(--rose);border-color:rgba(251,113,133,.3)}
.btn.danger.armed{background:var(--rose);color:#05070b;border-color:transparent}

@keyframes pulse{50%{opacity:.35}}
@keyframes flow{
  from{background-position:0% 0%,0% 0%,0 0}
  to{background-position:200% 0%,200% 0%,0 0}
}
@keyframes sway{
  0%{transform:translate3d(-2%,0,0) skewX(-8deg) scaleY(1)}
  33%{transform:translate3d(2%,-3%,0) skewX(5deg) scaleY(1.14)}
  66%{transform:translate3d(-1%,2%,0) skewX(-3deg) scaleY(.9)}
  100%{transform:translate3d(-2%,0,0) skewX(-8deg) scaleY(1)}
}
@keyframes twinkle{from{opacity:.45}to{opacity:.9}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}

@media (max-width:820px){
  .base{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .top-in{padding:12px 16px}
  .hero{padding:44px 16px 20px}
  .stats{gap:8px}
  .stat{padding:14px 12px}
  .stat b{font-size:1.3rem}
  .stat span{font-size:.62rem;letter-spacing:.06em}
  .glass{padding:18px}
  .grid{grid-template-columns:1fr}
  .bar{padding:12px 16px}
  .bar .muted{display:none}
  .bar-in{width:100%}
  .cta{width:100%}
  .sheet{padding:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark">H</span><span>Handoff</span></div>
    <nav class="seg" role="tablist" aria-label="Navigation">
      <button type="button" role="tab" data-go="create" aria-selected="true">Créer</button>
      <button type="button" role="tab" data-go="history" aria-selected="false">Historique</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <span class="eyebrow">Transmission de service</span>
    <h1>Aucune info <span class="gt">perdue.</span><br>Aucun stress.</h1>
    <p class="lede">Transmettez le contexte complet à l'équipe suivante en quelques minutes, puis retrouvez chaque passage à tout moment.</p>
    <div class="stats">
      <div class="stat"><b id="st-total">0</b><span>Handoffs</span></div>
      <div class="stat"><b id="st-last">—</b><span>Dernier passage</span></div>
      <div class="stat"><b id="st-prio">0</b><span>Priorités (dernier)</span></div>
    </div>
  </section>

  <!-- CRÉER -->
  <section id="create" class="view">
    <div class="glass base-card">
      <div class="sec-head"><h2>Nouveau handoff</h2></div>
      <div class="base">
        <div class="field"><label for="date">Date</label><input type="date" id="date"></div>
        <div class="field"><label for="employee">Employé</label><input id="employee" placeholder="Prénom Nom" autocomplete="off"></div>
        <div class="field"><label for="location">Lieu</label><input id="location" placeholder="Magasin, bureau…" autocomplete="off"></div>
      </div>
      <div class="field" style="margin-top:18px">
        <label>Service</label>
        <div class="chips" id="shifts"></div>
      </div>
    </div>

    <div class="grid" id="panels"></div>

    <div class="bar">
      <div class="bar-in">
        <span class="muted" id="total"></span>
        <button class="cta" id="save" type="button">Enregistrer le handoff</button>
      </div>
    </div>
  </section>

  <!-- HISTORIQUE -->
  <section id="history" class="view" hidden>
    <div class="tools">
      <input id="q" class="search" type="search" placeholder="Rechercher un nom, un lieu, une tâche…" aria-label="Rechercher">
    </div>
    <div class="sec-head"><h2>Mes handoffs</h2><span class="count" id="count-h">0</span></div>
    <div class="cards" id="cards"></div>
  </section>

</main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'handoff.v2';
const SECTIONS = [
  {k:'tasks',      t:'Tâches effectuées',      i:'✓',  ph:'Ce qui a été fait…'},
  {k:'problems',   t:'Problèmes rencontrés',   i:'⚠️', ph:'Signaler un problème…'},
  {k:'clients',    t:'Clients à rappeler',     i:'📞', ph:'Nom et raison…'},
  {k:'orders',     t:'Commandes en attente',   i:'📦', ph:'Numéro et statut…'},
  {k:'stock',      t:'Stock critique',         i:'📊', ph:'Article et quantité…'},
  {k:'cash',       t:'Caisse / Paiements',     i:'💰', ph:'Montant, observations…'},
  {k:'equipment',  t:'Matériel défectueux',    i:'🔧', ph:'Description du problème…'},
  {k:'priorities', t:'Priorités pour demain',  i:'⭐', ph:'À faire en priorité…', hot:true}
];
const SHIFTS = [
  {v:'🌅 Matin', h:'6h–14h'},
  {v:'☀️ Après-midi', h:'14h–22h'},
  {v:'🌙 Nuit', h:'22h–6h'},
  {v:'📅 Complet', h:'24h'}
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag = (i, n) => n ? `<span class="tag">${i} ${n}</span>` : '';
const fmtDate = (iso, opts = {day:'numeric', month:'short', year:'numeric'}) => {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('fr-FR', opts);
};

/* Stockage : localStorage avec repli mémoire si indisponible */
let mem = {};
const store = {
  get(k) {
    try { return JSON.parse(localStorage.getItem(k)); }
    catch (e) { return mem[k] ?? null; }
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
};

const S = {
  draft: Object.fromEntries(SECTIONS.map(s => [s.k, []])),
  shift: '',
  list: store.get(KEY) || store.get('handoffs') || [],
  q: '',
  openId: null
};

/* Construction de l'interface */
$('#shifts').innerHTML = SHIFTS.map(s =>
  `<button type="button" class="chip" data-v="${esc(s.v)}" aria-pressed="false">${esc(s.v)}<small>${s.h}</small></button>`
).join('');

$('#panels').innerHTML = SECTIONS.map(s => `
  <article class="glass panel${s.hot ? ' hot' : ''}" data-k="${s.k}">
    <header class="ph">
      <span class="ico" aria-hidden="true">${s.i}</span>
      <h3>${s.t}</h3>
      <span class="count" id="c-${s.k}">0</span>
    </header>
    <div class="add">
      <textarea rows="1" placeholder="${s.ph}" aria-label="${s.t}"></textarea>
      <button class="plus" type="button" aria-label="Ajouter à ${s.t}">+</button>
    </div>
    <ul class="items" id="l-${s.k}"></ul>
  </article>`).join('');

function renderDraft() {
  SECTIONS.forEach(({k}) => {
    const items = S.draft[k];
    $('#c-' + k).textContent = items.length;
    $('#l-' + k).innerHTML = items.map((t, i) =>
      `<li><span>${esc(t)}</span><button class="icon-btn" type="button" data-rm="${i}" aria-label="Retirer">✕</button></li>`
    ).join('');
  });
  const total = Object.values(S.draft).reduce((a, b) => a + b.length, 0);
  $('#total').textContent = total
    ? `${total} élément${total > 1 ? 's' : ''} prêt${total > 1 ? 's' : ''}`
    : 'Aucun élément pour l’instant';
}

function addItem(k) {
  const ta = document.querySelector(`[data-k="${k}"] textarea`);
  const v = ta.value.trim();
  if (!v) return ta.focus();
  S.draft[k].push(v);
  ta.value = '';
  renderDraft();
  ta.focus();
}

$('#panels').addEventListener('click', e => {
  const panel = e.target.closest('.panel');
  if (!panel) return;
  const k = panel.dataset.k;
  if (e.target.closest('.plus')) return addItem(k);
  const rm = e.target.closest('[data-rm]');
  if (rm) { S.draft[k].splice(+rm.dataset.rm, 1); renderDraft(); }
});

$('#panels').addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    addItem(e.target.closest('.panel').dataset.k);
  }
});

$('#shifts').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  S.shift = b.dataset.v;
  $('#shifts').classList.remove('invalid');
  syncChips();
});

function syncChips() {
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === S.shift));
}

function toast(msg, type) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'err' ? ' err' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* Sauvegarde */
function saveHandoff() {
  const fields = {
    date: $('#date').value,
    employee: $('#employee').value.trim(),
    location: $('#location').value.trim()
  };
  let firstBad = null;
  ['date', 'employee', 'location'].forEach(k => {
    const el = $('#' + k);
    const bad = !fields[k];
    el.classList.toggle('invalid', bad);
    if (bad && !firstBad) firstBad = el;
  });
  const shiftBad = !S.shift;
  $('#shifts').classList.toggle('invalid', shiftBad);
  if (shiftBad && !firstBad) firstBad = $('#shifts').firstElementChild;

  if (firstBad) {
    toast('Complétez les champs obligatoires', 'err');
    firstBad.focus();
    return;
  }

  S.list.push({
    id: Date.now(),
    ...fields,
    shift: S.shift,
    ...Object.fromEntries(SECTIONS.map(s => [s.k, [...S.draft[s.k]]]))
  });
  store.set(KEY, S.list);

  SECTIONS.forEach(s => S.draft[s.k] = []);
  $('#employee').value = '';
  $('#location').value = '';
  S.shift = '';
  syncChips();
  renderDraft();
  renderStats();
  toast('Handoff enregistré ✓');
}

/* Historique */
const sorted = () => [...S.list].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

function renderStats() {
  const last = sorted()[0];
  $('#st-total').textContent = S.list.length;
  $('#st-last').textContent = last ? fmtDate(last.date, {day:'numeric', month:'short'}) : '—';
  $('#st-prio').textContent = last ? (last.priorities || []).length : 0;
}

const cardHTML = h => `
  <button class="card" type="button" data-id="${h.id}">
    <span class="badge">${esc(h.shift)}</span>
    <span class="meta">${esc(fmtDate(h.date, {weekday:'long', day:'numeric', month:'long'}))}</span>
    <span class="name">${esc(h.employee)}</span>
    <span class="loc">📍 ${esc(h.location)}</span>
    <span class="tags">${tag('✓', h.tasks.length)}${tag('⚠️', h.problems.length)}${tag('⭐', h.priorities.length)}</span>
  </button>`;

function renderList() {
  const q = S.q.trim().toLowerCase();
  const items = sorted().filter(h => !q || [
    h.employee, h.location, h.shift, ...SECTIONS.flatMap(s => h[s.k] || [])
  ].join(' ').toLowerCase().includes(q));

  $('#count-h').textContent = items.length;
  $('#cards').innerHTML = items.length
    ? items.map(cardHTML).join('')
    : `<div class="empty"><h3>${S.list.length ? 'Aucun résultat' : 'Aucun handoff pour le moment'}</h3>
       <p>${S.list.length ? 'Essayez un autre mot-clé.' : 'Créez votre premier handoff pour commencer.'}</p></div>`;
}

$('#q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
$('#cards').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) openHandoff(+c.dataset.id);
});

/* Détail, export, suppression */
const dlg = $('#dlg');

function openHandoff(id) {
  const h = S.list.find(x => x.id === id);
  if (!h) return;
  S.openId = id;

  const block = s => (h[s.k] || []).length
    ? `<div class="msec"><h4>${s.i} ${s.t}</h4><ul>${h[s.k].map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`
    : '';

  $('#dlg').innerHTML = `
    <div class="sheet">
      <div class="sh-top">
        <span class="badge">${esc(h.shift)}</span>
        <button class="icon-btn" id="closeX" type="button" aria-label="Fermer" style="font-size:1.2rem">✕</button>
      </div>
      <h2 class="sh-title">${esc(h.employee)}</h2>
      <p class="sh-meta">${esc(fmtDate(h.date, {weekday:'long', day:'numeric', month:'long', year:'numeric'}))} · 📍 ${esc(h.location)}</p>
      ${SECTIONS.map(block).join('') || '<p class="sh-meta" style="margin-top:20px">Aucune information renseignée.</p>'}
      <div class="acts">
        <button class="btn primary" id="exp" type="button">⬇ Exporter .txt</button>
        <button class="btn danger" id="del" type="button">Supprimer</button>
      </div>
    </div>`;

  $('#closeX').onclick = () => dlg.close();
  $('#exp').onclick = () => exportHandoff(h);
  $('#del').onclick = () => deleteHandoff(id, $('#del'));
  dlg.showModal();
}

function exportHandoff(h) {
  const lines = [
    `HANDOFF — ${h.employee}`,
    `Date : ${fmtDate(h.date, {weekday:'long', day:'numeric', month:'long', year:'numeric'})}`,
    `Service : ${h.shift}`,
    `Lieu : ${h.location}`
  ];
  SECTIONS.forEach(s => {
    if ((h[s.k] || []).length) lines.push('', s.t.toUpperCase() + ' :', ...h[s.k].map(t => '• ' + t));
  });
  const url = URL.createObjectURL(new Blob([lines.join('\n')], {type: 'text/plain;charset=utf-8'}));
  const a = Object.assign(document.createElement('a'), {
    href: url,
    download: `handoff-${h.date}-${h.employee.replace(/\s+/g, '_')}.txt`
  });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Fichier exporté');
}

function deleteHandoff(id, btn) {
  if (!btn.dataset.armed) {
    btn.dataset.armed = '1';
    btn.textContent = 'Confirmer la suppression';
    btn.classList.add('armed');
    setTimeout(() => {
      if (btn.isConnected) {
        delete btn.dataset.armed;
        btn.textContent = 'Supprimer';
        btn.classList.remove('armed');
      }
    }, 3000);
    return;
  }
  S.list = S.list.filter(x => x.id !== id);
  store.set(KEY, S.list);
  dlg.close();
  renderList();
  renderStats();
  toast('Handoff supprimé');
}

dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* Navigation */
function setView(v) {
  $('#create').hidden = v !== 'create';
  $('#history').hidden = v !== 'history';
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.go === v));
  if (v === 'history') renderList();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => setView(b.dataset.go)));
$('#save').addEventListener('click', saveHandoff);

/* Init */
$('#date').value = new Date().toLocaleDateString('en-CA');
renderDraft();
renderStats();
renderList();
setView('create');
</script>
</body>
</html>
